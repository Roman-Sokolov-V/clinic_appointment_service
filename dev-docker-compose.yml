services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - clinic_db:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clinic:
    build: .
    env_file:
      - .env
#    environment:
#      - IN_DOCKER=True # використовується в settings для підключення постгресс бд якщо запущено в контейнері
    entrypoint: ["./entrypoint.sh"]  # тут застосування міграцій і запуск сервера
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

# додаю нові сервіси:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: clinic_rabbitmq
    restart: always
    env_file:
      - .env
    ports:
      #- "5672:5672"   # Для Celery
      - "15672:15672" # Для веб-панелі
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  celery:
    build: .
    container_name: clinic_celery
    restart: on-failure
    env_file:
      - .env
    command: celery -A config worker --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  celery-beat:
    build: .
    container_name: clinic_celery_beat
    restart: on-failure
    env_file:
      - .env
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

