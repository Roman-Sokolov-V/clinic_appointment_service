[project]
name = "clinic-appointment-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=48.0.0",
    "dotenv>=0.9.9",
    "requests>=2.34.2",
]


[project.optional-dependencies]
clinic = [
    "celery-types>=0.26.0",
    "celery[librabbitmq]>=5.6.3",
    "dj-rest-auth>=7.2.0",
    "django-allauth>=65.17.0",
    "django-celery-beat>=2.9.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "djangorestframework-stubs>=3.17.0",
    "flower>=2.0.1",
    "psycopg[binary]>=3.3.4",
    "stripe>=15.2.0",
]

bot = [
    "aiogram>=3.29.0",
    "asyncpg>=0.31.0",
     "httpx>=0.28.1",
     "redis>=8.0.0",
]

[tool.uv]
managed = true
package = false